name: remote_sensing
channels:
  - conda-forge

dependencies:
  # core
  - python=3.11
  - pip
  - setuptools

  # array and data
  - numpy<2
  - pandas
  - xarray
  - bottleneck
  - numba

  # geospatial stack
  - rasterio
  - rioxarray
  - geopandas
  - shapely
  - pyproj
  - fiona
  - cartopy
  - osmnx

  # visualization
  - matplotlib
  - holoviews
  - hvplot
  - bokeh
  - panel

  # dask
  - dask
  - distributed
  - dask-core
  - dask-dataframe

  # stac and eo
  - odc-stac
  - pystac-client

  # notebooks
  - jupyterlab
  - ipykernel


